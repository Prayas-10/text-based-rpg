name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure
      run: cmake -S . -B build -G "Ninja" -A x64 -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

    - name: Build
      run: cmake --build build --config Release

    - name: Install to package
      run: cmake --install build --prefix package --config Release

    - name: Install NSIS (for creating Windows installer)
      run: choco install nsis -y

    - name: Create installer & zip via CPack
      working-directory: build
      run: |
        cpack -C Release -G NSIS
        cpack -C Release -G ZIP

    - name: Show build artifacts
      run: powershell -Command "Get-ChildItem -Recurse build | Where-Object { $_.Extension -in '.exe','.zip' } | Sort-Object FullName | ForEach-Object { $_.FullName }"

    - name: Find generated artifacts
      id: find_artifacts
      shell: powershell
      run: |
        $zip = Get-ChildItem -Path build -Filter '*.zip' -Recurse | Select-Object -First 1
        $exe = Get-ChildItem -Path build -Filter '*.exe' -Recurse | Select-Object -First 1
        if ($zip) { Write-Host "Found zip: $($zip.FullName)" } else { Write-Host "No zip found" }
        if ($exe) { Write-Host "Found exe: $($exe.FullName)" } else { Write-Host "No exe found" }
        $zipName = if ($zip) { $zip.Name } else { '' }
        $exeName = if ($exe) { $exe.Name } else { '' }
        echo "::set-output name=zip::$($zip.FullName)"
        echo "::set-output name=zip_name::$zipName"
        echo "::set-output name=exe::$($exe.FullName)"
        echo "::set-output name=exe_name::$exeName"

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        release_name: ${{ github.ref_name }}
        body: |
          Dharmadeva's Blade ${{ github.ref_name }}

          Built automatically from this tag. Grab DharmadevasBlade-${{ github.ref_name }}.zip
          to run it standalone, or the .exe installer to install it properly on Windows.

    - name: Upload ZIP asset
      if: steps.find_artifacts.outputs.zip != ''
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.find_artifacts.outputs.zip }}
        asset_name: ${{ steps.find_artifacts.outputs.zip_name }}
        asset_content_type: application/zip

    - name: Upload NSIS installer
      if: steps.find_artifacts.outputs.exe != ''
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.find_artifacts.outputs.exe }}
        asset_name: ${{ steps.find_artifacts.outputs.exe_name }}
        asset_content_type: application/octet-stream
